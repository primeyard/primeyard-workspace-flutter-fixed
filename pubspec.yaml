name: primeyard_workspace_native
publish_to: 'none'
description: PrimeYard Workspace native Flutter app rebuild
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  http: ^1.5.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo-full.png
    - assets/logo-mark.png
    - assets/mascot.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo-mark.png
  min_sdk_android: 21
